<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de materia</title>
    <link rel="stylesheet" th:href="@{/estilos.css}" href="/estilos.css">
</head>
<body>
<main class="contenedor estrecho">
    <p class="subtitulo" th:text="${nombreProyecto}">Nombre del proyecto</p>
    <h1>Formulario de materia</h1>
    <p>El formulario envía los datos al controlador usando <code>@ModelAttribute</code>.</p>
    <!-- th:object usa el DTO "materia" enviado desde MateriasMvcController. -->
    <form th:action="@{/materias/guardar}" th:object="${materia}" method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" required>

        <label for="categoria">Categoría</label>
        <select id="categoria" th:field="*{categoria}" required>
            <option value="">Selecciona una categoría</option>
            <option value="Web">Web</option>
            <option value="Redes">Redes</option>
        </select>
        <button type="submit" class="boton primario">Enviar formulario</button>
    </form>
    <p class="nota">Al enviar el formulario, la materia aparecerá en la lista. Se conserva solamente mientras Spring Boot esté encendido.</p>
    <p><a th:href="@{/materias}">Volver a la lista</a></p>
</main>
</body>
</html>
